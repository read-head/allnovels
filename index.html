<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4fa;--ink:#1b2140;--muted:#5d6488;--accent:#3846c7;--card:#fff;--line:#d8dcee}
@media (prefers-color-scheme:dark){:root{--bg:#141833;--ink:#eef0fb;--muted:#a4abd0;--accent:#8c98ff;--card:#1e2347;--line:#323a70}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;line-height:1.6}
header,main,footer{max-width:1000px;margin:0 auto;padding:0 20px}
header{padding-top:48px;padding-bottom:12px}
h1{font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:800;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;margin:0 0 10px}
header p{color:var(--muted);margin:0 0 24px;max-width:52ch}
input{width:100%;max-width:420px;padding:12px 14px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px}
input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px;padding:28px 0 48px}
.card{display:block;color:inherit;text-decoration:none}
.cover{aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--line);box-shadow:0 2px 8px rgba(20,24,60,.25)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:12px;text-align:center;color:#fff;font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:800}
.card:hover .cover{transform:translateY(-3px)}
.cover{transition:transform .15s}
@media (prefers-reduced-motion:reduce){.cover{transition:none}}
.title{font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:600;margin:10px 0 0;line-height:1.25}
.meta{color:var(--muted);font-size:.9rem}
.empty{color:var(--muted);display:none}
footer{padding-bottom:40px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<header>
  <h1>My Library</h1>
  <p>Original stories and series, free to read. Pick a cover to see its chapters.</p>
  <input id="q" type="search" placeholder="Search titles" aria-label="Search titles">
</header>
<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">No series match that search.</p>
</main>
<footer>&copy; <span id="yr"></span> Your Name. All works are original.</footer>

<script>
// ===== EDIT THIS LIST to add your series =====
// slug = folder name inside "series/". Cover image goes in "covers/slug.jpg".
const SERIES = [
  { title: "Campfire Cooking in Another World with My Absurd Skill", slug: "v1-campfire-cooking", note: "Isekai, Slice-of-Life, Adventure, Fantasy" }
];
// =============================================

const colors = ["#3846c7","#0f7a6b","#a23b72","#c2571a","#5b3fa0","#2b6cb0"];
const grid = document.getElementById("grid");

SERIES.forEach((s, i) => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = "series/" + s.slug + "/index.html";
  a.dataset.title = s.title.toLowerCase();
  a.innerHTML = '<div class="cover"></div><p class="title"></p><span class="meta"></span>';
  a.querySelector(".title").textContent = s.title;
  a.querySelector(".meta").textContent = s.note || "";
  const box = a.querySelector(".cover");
  const img = new Image();
  img.alt = s.title + " cover";
  img.src = "book-covers/" + s.slug + ".jpg";
  img.onerror = () => {
    box.innerHTML = '<div class="fallback"></div>';
    const f = box.firstChild;
    f.textContent = s.title;
    f.style.background = colors[i % colors.length];
  };
  box.appendChild(img);
  grid.appendChild(a);
});

document.getElementById("q").addEventListener("input", e => {
  const term = e.target.value.trim().toLowerCase();
  let shown = 0;
  grid.querySelectorAll(".card").forEach(c => {
    const hit = c.dataset.title.includes(term);
    c.style.display = hit ? "" : "none";
    if (hit) shown++;
  });
  document.getElementById("empty").style.display = shown ? "none" : "block";
});

document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
